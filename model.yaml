apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: deepseek-tiny
spec:
  template:
    apiVersion: ai.sap.com/v1alpha1
    kind: Serving
    metadata:
      name: deepseek-tiny
    spec:
      replicas: 1
      predictor:
        containers:
          - name: deepseek
            image: <your-container-registry-image>    # you will fill this later
            ports:
              - containerPort: 8080
            resources:
              limits:
                memory: "8Gi"
                cpu: "4"
