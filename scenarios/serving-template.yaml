apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: deepseek-serving
  labels:
    app.kubernetes.io/name: deepseek
    app.kubernetes.io/component: model
spec:
  # Docker image with your DeepSeek model
  image: madanmathvan/deepseek:latest

  # Number of replicas
  replicas: 1

  # Protocol for requests
  protocol: http

  # Port that the FastAPI app listens on
  port: 8000

  # CPU & memory resource requests and limits
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

  # Environment variables inside the container
  env:
    - name: MODEL_PATH
      value: "/app/model/DeepSeek-R1-Distill-Qwen-1.5B-Q4_1.gguf"

  # Health checks
  livenessProbe:
    httpGet:
      path: /infer
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /infer
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
