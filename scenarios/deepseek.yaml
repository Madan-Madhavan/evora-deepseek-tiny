apiVersion: ai.sap.com/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deepseek-pipeline
  annotations:
    scenarios.ai.sap.com/description: "DeepSeek reasoning model"
    scenarios.ai.sap.com/name: "DeepSeek Reasoner"
    executables.ai.sap.com/description: "Runs DeepSeek inference on prompts"
    executables.ai.sap.com/name: "DeepSeek Inference"
  labels:
    scenarios.ai.sap.com/id: "deepseek"
    ai.sap.com/version: "1.0"
spec:
  entrypoint: deepseek-entry
  templates:
    - name: deepseek-entry
      steps:
        - - name: deepseek-step
            template: deepseek-container

    - name: deepseek-container
      container:
        image: madanmathavan/deepseek:latest
        command: ["python", "-m", "uvicorn"]
        args:
        - "python /app/app.py"
        env:
          - name: MODEL_PATH
            value: "/app/model/DeepSeek-R1-Distill-Qwen-1.5B-Q4_1.gguf"
          - name: PORT
            value: "9001"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
